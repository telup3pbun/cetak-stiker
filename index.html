<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Cetak Stiker PLN UP3 PBN</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{
  --primary:#0d6efd;
  --bg:#f4f6f9;
}
body{
  font-family: Arial, sans-serif;
  background:var(--bg);
  padding:30px;
}
.container{
  max-width:720px;
  margin:auto;
}
h2{
  margin-bottom:10px;
}
.tabs button{
  padding:10px 16px;
  border:none;
  background:#dee2e6;
  cursor:pointer;
  border-radius:6px 6px 0 0;
  margin-right:4px;
}
.tabs button.active{
  background:var(--primary);
  color:#fff;
}
.card{
  background:#fff;
  padding:20px;
  border-radius:0 6px 6px 6px;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
}
label{
  font-weight:bold;
  display:block;
  margin-top:12px;
}
input{
  width:97%;
  padding:8px;
  margin-top:4px;
}
button.action{
  margin-top:16px;
  width:100%;
  padding:10px;
  font-size:15px;
  background:var(--primary);
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.progress-box{
  margin-top:16px;
  display:none;
}
.progress{
  height:18px;
  background:#e9ecef;
  border-radius:10px;
  overflow:hidden;
}
.progress-bar{
  height:100%;
  width:0%;
  background:var(--primary);
  transition:width .2s;
}
.progress-text{
  margin-top:6px;
  font-size:13px;
}
.hidden{display:none;}
</style>
</head>

<body>
<div class="container">

<h2>Cetak Stiker PLN UP3 PBN</h2>

<div class="tabs">
  <button id="tabSingle" class="active" onclick="showMenu('single')">Cetak Satu</button>
  <button id="tabBatch" onclick="showMenu('batch')">Cetak Banyak (Excel)</button>
</div>

<!-- CETAK SATU -->
<div id="single" class="card">
  <label>IDPEL</label>
  <input id="idpel" placeholder="cth : 224130052873">

  <label>Nama Pelanggan</label>
  <input id="nama" placeholder="cth : UP3 PBN">

  <label>Kode RBM (KDDK)</label>
  <input id="kode" placeholder="cth : FEACXAF75170">

  <label>Tarif / Daya</label>
  <input id="daya" placeholder="cth : R1MT / 900 VA">

  <button class="action" onclick="cetakSatu()">Cetak PDF</button>
</div>

<!-- CETAK BATCH -->
<div id="batch" class="card hidden">
  <label>Upload Excel (format wajib xlsx / xls)</label>
  <a href="https://drive.google.com/uc?export=download&id=19shV9A0Le-8J6BZ0YovrHPAVYo3GeL5Q">Format Excel Klik Disini</a>
  <input type="file" id="excelFile" accept=".xlsx,.xls">

  <button class="action" onclick="cetakBatch()">Proses & Gabung PDF</button>

  <div class="progress-box" id="progressBox">
    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-text" id="progressText">0%</div>
  </div>
</div>

<div id="qrcode" style="display:none;"></div>

</div>

<script>
function showMenu(id){
  single.classList.add("hidden");
  batch.classList.add("hidden");
  tabSingle.classList.remove("active");
  tabBatch.classList.remove("active");

  document.getElementById(id).classList.remove("hidden");
  document.getElementById("tab"+id.charAt(0).toUpperCase()+id.slice(1)).classList.add("active");
}

async function drawSticker(pdf,data,isFirst){
  const qrDiv=document.getElementById("qrcode");
  qrDiv.innerHTML="";
  new QRCode(qrDiv,{text:data.idpel,width:600,height:600});
  await new Promise(r=>setTimeout(r,150));
  const qrImg=qrDiv.querySelector("canvas").toDataURL("image/png");

  if(!isFirst) pdf.addPage([50,30],"landscape");

  pdf.setFont("helvetica","bold");
  pdf.setFontSize(19);
  pdf.text(data.idpel,25,8,{align:"center"});
  pdf.line(2,9,48,9);
  pdf.addImage(qrImg,"PNG",2,12,13,13);

  pdf.setFontSize(6.5);
  pdf.text(data.nama.toUpperCase(),16,13);
  pdf.text(data.kode,16,17);

  pdf.setFont("helvetica","normal");
  pdf.text(data.daya,16,21);

  pdf.setFontSize(6.5);
  pdf.text("Download Aplikasi PLN Mobile",16,25);
  
  pdf.setFontSize(6.5);
  pdf.text("di App Store & Play Store",16,28);
}

async function cetakSatu(){
  const { jsPDF } = window.jspdf;
  const pdf=new jsPDF({orientation:"landscape",unit:"mm",format:[50,30]});

  await drawSticker(pdf,{
    idpel:idpel.value,
    nama:nama.value,
    kode:kode.value,
    daya:daya.value
  },true);

  pdf.save(idpel.value+".pdf");
}

async function cetakBatch(){
  const file=excelFile.files[0];
  if(!file){alert("Upload Excel dulu");return;}

  progressBox.style.display="block";
  progressBar.style.width="0%";
  progressText.textContent="0%";

  const reader=new FileReader();
  reader.onload=async e=>{
    const wb=XLSX.read(e.target.result,{type:"binary"});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws);
    const total=rows.length;

    const { jsPDF } = window.jspdf;
    const pdf=new jsPDF({orientation:"landscape",unit:"mm",format:[50,30]});

    let i=0;
    for(const r of rows){
      await drawSticker(pdf,{
        idpel:String(r.IDPEL),
        nama:r.NAMA,
        kode:r.KODE_RBM,
        daya:r.DAYA
      },i===0);

      i++;
      const pct=Math.round((i/total)*100);
      progressBar.style.width=pct+"%";
      progressText.textContent=`${pct}% (${i}/${total})`;
    }

    pdf.save("BATCH_PRINT_STIKER.pdf");
    progressText.textContent="Selesai ✔";
  };
  reader.readAsBinaryString(file);
}

showMenu("single");
</script>

</body>
</html>
